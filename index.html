<script>
var D={"j":[{"t":"Жаңа ментор топты, жаңа оқушыларды қабылдаған күні ата-аналар мен оқушыларға қашанға дейін байланысып, өзін таныстырып, танысу кеші уақытын белгілеуі тиіс?","o":["Келесі жұмыс күнінің соңына дейін","Сол күні кешке дейін","Алғашқы сабақтан кейін бір апта ішінде","Ата-ана өзі жазғанша күтеді"],"a":1},{"t":"Ата-ана баласы туралы КБ сұрады, бірақ менторда ақпарат жоқ. КБ берілетін нақты мерзім қандай болуы керек?","o":["3 күнге дейін","Бір апта ішінде","Мерзім белгіленбейді, ақпарат жиналғанда хабарласады","1 күннен аспауы тиіс"],"a":3},{"t":"Кіріс қоңырауға жауап берудің дұрыс сәлемдесу стандарты қайсысы?","o":["«Сәлеметсіз бе, бұл куратор (аты), қалай көмектесе аламын?»","«Алло, тыңдап тұрмын»","«Иә, кім қоңырау шалды?»","«Сәлеметсіз бе, не болды?»"],"a":0},{"t":"Куратор ата-анаға қаратып қай сөздерді қолдануы керек?","o":["«Аға», «Тәте»","«Апай», «Ағай»","«Ханым», «Мырза»","Тек есімімен, ешқандай құрметті сөзсіз"],"a":2},{"t":"Куратор қай сөздерді қолдануға тыйым салынған?","o":["«Ханым», «Мырза»","«Сәлеметсіз бе»","«Күшті мұғалім», «әлсіз мұғалім»","«Мен анықтап, сізге кері байланыс беремін»"],"a":2},{"t":"WhatsApp-та жіберілетін дауыс хабарламасының ұзақтығы қандай болуы тиіс?","o":["1 минуттан аспауы тиіс","2 минутқа дейін","3 минутқа дейін","Шектеу жоқ"],"a":0},{"t":"Куратор ата-аналар мен мұғалімдерді бір чатқа біріктіріп, ортақ әңгіме құра ала ма?","o":["Иә, егер бұл ыңғайлы болса","Иә, тек шағым болғанда","Иә, тек тимлидтің рұқсатымен","Жоқ, қатаң тыйым салынады"],"a":3},{"t":"Ата-ана жұмыс уақыты біткеннен кейін қоңырау шалса немесе жазса, куратор не істейді?","o":["Мүлде жауап бермейді","Жауап бермеуге құқылы, бірақ жұмысқа келе салысымен міндетті түрде қайта қоңырау шалады/жауап береді","Қанша уақыт болса да, бірден жеке нөмірінен жауап береді","Ата-ана қайта жазғанша күтеді"],"a":1},{"t":"Төмендегілердің қайсысы КБ критерийлеріне жатпайды?","o":["Баланы басқа оқушылармен салыстыру","Түсінікті болуы","Тұрақты болуы","Дер кезінде берілуі"],"a":0},{"t":"Сэндвич әдісінің дұрыс реті қайсысы?","o":["Сын → оң КБ → оң КБ","Қиындықтар → шешім → мақтау","Оң КБ → қиындықтар/проблемалар → баланың қолынан келетініне сенім (оң КБ)","Оң КБ → оң КБ → сын"],"a":2},{"t":"ППРС әдісінің аббревиатурасы қалай ашылады?","o":["План, Прогресс, Результат, Срок","Проблема, Причина, Решение, Сроки","Проблема, Предложение, Реакция, Сумма","Причина, Процесс, Решение, Статистика"],"a":1},{"t":"Жұмыс уақытынан тыс автоматты хабарлама орнату туралы қай тұжырым дұрыс?","o":["Міндетті емес, куратор қаласа орнатады","Тек демалыс күндері орнатылады","Ата-ана сұраған жағдайда ғана орнатылады","Автоматты хабарлама міндетті түрде орнатылуы тиіс"],"a":3},{"t":"Куратор ата-анаға мұғалімнің жеке нөмірін бере ала ма?","o":["Иә, ата-ана сұраса","Иә, тек шұғыл жағдайда","Тек ата-ана екінші рет сұраса","Жоқ, қатаң тыйым салынады"],"a":3},{"t":"Сапа бақылау бөлімінің міндетіне жатпайтыны қайсысы?","o":["Клиентпен байланысқа баға беріп, кері байланыс беру","Оқушыларға пән сабағын өткізу","Тұрақты чаттармен жұмысты тексеру","Кураторларды оқыту және аттестация жасау"],"a":1},{"t":"Ата-ананың сұрағына куратор жауап білмесе, қалай әрекет еткені дұрыс?","o":["Үнсіз отырып, ақпаратты еске түсіргенше күту","Болжап, ең ықтимал жауапты айту","Бірден «мен анықтап, сізге кері байланыс беремін» деп айту","Сұрақты елемей, басқа тақырыпқа ауысу"],"a":2},{"t":"«Шағым – сыйлық» формуласындағы бірінші қадам қайсысы?","o":["Рақмет айту","Қателік үшін кешірім сұрау","Мәселені дереу түзету","Қажетті ақпаратты анықтау"],"a":0},{"t":"Куратор ата-анаға WhatsApp-та қалай жазуы тиіс?","o":["Қысқартуларды қолданып, тез және қысқа","Толық, ойластырылған мәтінмен, грамматика мен пунктуацияны сақтап, жібермес бұрын қателерін тексеріп","Маңызды сөздерді Caps Lock-пен жазып","Тек 2–3 секундтық дауыс хабарламаларымен"],"a":1},{"t":"Ата-ана куратордың Telegram-ына жазса, куратор не істеуі керек?","o":["Жауап беріп, алдағы уақытта WhatsApp-қа жазуға бағыттауы керек","Telegram-да ғана жалғастыра беруі керек","Жауап бермеуі керек, себебі ресми арна WhatsApp","Ата-анаға қоңырау шалуға тыйым салынады деп айтуы керек"],"a":0},{"t":"Баланы бір топтан екіншісіне ауыстыру кімнің рұқсатымен жүзеге асады?","o":["Тек ата-ананың өтінішімен","Куратордың өз шешімімен","Мұғалімнің өз шешімімен","Оқу бөлімі, куратор тимлид басшылардың рұқсатымен"],"a":3},{"t":"Ментордың «мазаламаймын ба?» деген тіркесті қолдануы туралы қай тұжырым дұрыс?","o":["Әр қоңырау басында міндетті түрде айтуы керек","Тек кешкі уақытта айтады","Қолданбауы тиіс: хабарласқан бойда бірден мәселеге көшуі керек","Тек WhatsApp-та қолданады"],"a":2}],"s":[{"t":"Ата-ана қоңырау шалып, сабаққа/мұғалімге шағымданды. Куратордың әрекеттер реті қайсысында дұрыс көрсетілген?","o":["Мұғалімді қорғап, шағымның негізсіз екенін түсіндіру → мерзім белгілемей, мәселе шешілгенде хабарласу","Ата-ананың жағына шығып, мұғалімнің қателігін мойындау → мұғалімнің нөмірін беріп, өзара келісуін ұсыну","Тыңдап, нақтылап, естіп тұрғанын білдіру → жағдай ерекше екенін және онымен жұмыстанатынын айту (ешкімнің жағына шықпай) → КБ мерзімін белгілеу → қарсылықты жазып, формаға тіркеп, орындаушыны белгілеу → орындалуын бақылау → ата-анаға КБ беру","Шағымды жазып алу → шешімді бірден өзі айту → форманы толтырмай, ата-анаға қайта хабарламау"],"a":2},{"t":"Ата-ана баласы туралы КБ сұрады, бірақ куратор жаңа келген және баланы танымайды. Қай әрекет ережеге сәйкес?","o":["Нәтижелерді, қатысуды қарап, қажет болса мұғалімнен ақпарат жинап, КБ-ны нақты мерзімде (1 күннен аспай) беретінін айту","Жалпы мәліметтерге сүйеніп, баланың сипаттамасын болжап айтып, ата-ананы тыныштандыру","КурКаб-ты асығыс ашып, көрген алғашқы мәліметтерді бірден оқып беру","Бұл бала оның тобында емес екенін айтып, 3 күннен кейін қайта қоңырау шалуын сұрау"],"a":0},{"t":"Баланы жаңа кураторға ауыстыру кезінде қай тұжырым дұрыс?","o":["Тек баланың бағалары беріледі, ата-ана туралы ақпарат құпия болып қалады","Ауыстыруды куратор мен ата-ана өзара келісіп шеше алады, ақпарат беру міндетті емес","Жаңа куратор баланы өзі танып алуы тиіс, сондықтан бұрынғы шағымдар туралы айтылмайды","Баланың барлық ақпараты, қажет болса ата-ана туралы мәлімет (жеке келісімдер, жеке сабақтар, бұрынғы шағымдар, конфликттер) жаңа кураторға беріледі, ауыстыруға оқу бөлімі мен тимлидтің рұқсаты қажет"],"a":3},{"t":"КБ бермес бұрын нәтижелерді талдау ережесіне сәйкес КЕЛМЕЙТІН әрекетті көрсетіңіз.","o":["Апталық рейтинг бойынша баланың орташа балы мен қатысуын қарау","Нәтиженің төмендеу себебі анықталмай-ақ ата-анаға КБ беріп, себебін ата-анадан сұрау","Әр пәннен ең төмен және ең жоғары балл жиналған тақырыптарды өзі үшін белгілеп алу","Мәселе байқалса, баламен және мұғаліммен сөйлесіп, себебін анықтау"],"a":1},{"t":"Ата-ана: «Онлайн форматта баламның көңілі бөлінеді, бақылау жоқ» деді. Қай жауап құжаттағы аргументтерге сәйкес?","o":["Сабақ жазбасы сақталады, сондықтан бала көңіл бөлмесе де кейін қарай алады, бақылаудың қажеті жоқ","Камера міндетті, куратор әр 10–15 минут сайын тексереді, сабақта тақырыптық сұрақ-тесттер өтеді, үй тапсырмасын куратор жеке тексеріп, кері байланыс береді","Камера міндетті емес, бала сабақты тыңдап отырса жеткілікті","Бақылау толығымен ата-анаға жүктеледі, куратор тек кестені жібереді"],"a":1},{"t":"«Нәтиже болатынына кепілдік бар ма?» деген қарсылыққа ең дұрыс жауап қайсысы?","o":["100% жоғары балл аласыздар деп кепілдік беріп, ұнамаса бір айдан кейін ақшаны қайтарамыз деу","Кепілдік беруге болмайды, бұл сұрақты сату бөліміне жолдау","Бала өзі тырысса нәтиже болады, сондықтан орталықтың жауапкершілігі жоқ деп түсіндіру","Бір реттік уәде емес, жүйе беріледі: кіріс тест, ай сайынғы пробный тест пен зачет, апталық прогресс кестесі, әлсіз тақырыптарды ата-анамен бөлісу, кейстер мен статистика"],"a":3},{"t":"ППРС әдісінде «Шешім» кезеңінде куратор қалай әрекет етуі керек?","o":["Себепті анықтағаннан кейін ата-анадан жағдайға не әсер еткенін сұрап, бірлесіп шешім (қосымша сабақ, оқу жоспарын түзету, бақылауды күшейту т.б.) таңдап, мерзім белгілеу","Дереу өз шешімін айтып, ата-анадан тек келісім алу","Шешімді тек мұғалімге қалдырып, ата-анаға мерзімсіз хабарласатынын айту","Себебін талдамай-ақ қосымша сабақты ұсынып, мерзімді ата-ананың өзі белгілеуіне қалдыру"],"a":0},{"t":"Баланың үлгерімі төмен. Сэндвич әдісі бойынша қай КБ дұрыс құрылған?","o":["Төмен нәтижені бірден айтып, соңында «басқа балалар сияқты тырысуы керек» деп салыстыру","Тек жақсы жақтарын айтып, қиындықтарды ата-ана өзі байқасын деп қалдыру","Сабаққа қатысып жүргені мен белсенділігін атап өту → нақты қиындықты (уақытты пайдалану, нақты тақырыптар) айыптамай айту → іс-қимыл жоспарын бірге құрып, баланың қолынан келетініне сенім білдіру","Сынмен бастап, жауапкершілікті ата-анаға жүктеп, оң сөзбен аяқтау"],"a":2},{"t":"Қарсылықтармен жұмыс құрылымының дұрыс реті қайсысы?","o":["Қарсылық → Шешім → Себеп → Түсіну → Жұмыс → Мерзім → Келісу","Түсіну → Қарсылық → Жұмыс → Себеп → Шешім → Мерзім → Келісу","Себеп → Қарсылық → Шешім → Түсіну → Келісу → Жұмыс → Мерзім","Қарсылық → Себеп → Түсіну → Жұмыс → Шешім → Келісу → Мерзімдерді сақтау"],"a":3},{"t":"«Шағым – сыйлық» формуласындағы алғашқы төрт қадам қай жауапта дұрыс?","o":["Рақмет айту → пікірдің құнды екенін білдіру → қателік үшін кешірім сұрау → мәселені шешуге дереу шара қолданатынына уәде беру","Кешірім сұрау → рақмет айту → ақпаратты анықтау → қателікті түзету","Ақпаратты анықтау → қателікті түзету → рақмет айту → кешірім сұрау","Рақмет айту → қателікті түзету → пікірдің құнды екенін білдіру → кешірім сұрау"],"a":0},{"t":"Ата-ана: «Сату бөлімі ноутбук пен кітаптар сыйға беріледі деп уәде берген» деді, куратор бұл туралы білмейді. Қай жауап дұрыс?","o":["«Бұл сату бөлімінің сұрағы, маған қатысы жоқ, соларға жазыңыз»","«Білмеймін, бірақ ондай уәдені сату бөлімі жиі беріп жібереді»","«Түсіндім, қазір нақтылап алып, сол күннің соңына дейін мамандармен байланысып сізге жауап беремін»","«Иә, ноутбук беріледі», деп растап, кейін тексеру"],"a":2},{"t":"«Баламның оқығысы келмейді, мотивациясы жоқ» деген ата-анаға құжат бойынша ең дұрыс стратегия қайсысы?","o":["Бұл баланың жеке мәселесі екенін, ата-ана үйде өзі түсіндіруі керегін айту","Мотивацияны оқу форматы жасайтынын түсіндіру: тақырыптық тесттер, ай сайынғы зачет, 1–2 аптада көрінетін нәтиже, жеке бақылау және мұғалімге ескерту арқылы баланы сабақта белсенді ету","Мотивация болмаса, сабаққа қатысу міндетті емес деп, тек жазбаны көруді ұсыну","Басқа оқушылардың жетістіктерімен салыстырып, баланы бәсекелестікке итермелеу"],"a":1},{"t":"Ата-ана: «Курсқа төлейтін ақшам жоқ» деді. Қай әрекет құжаттағы тәсілге сәйкес?","o":["Түсіністік білдіріп, құндылықты көрсету және нарықпен салыстыру (орташа дайындық 40–60 мың), нақты мақсатты (грант) анықтап, қысым жасамай бөліп төлеу/рассрочка опциясын ұсыну","Бағаны төмендетуге болатынын айтып, жеке жеңілдік уәде ету","Төлем мүмкіндігі жоқ болса, курстан бас тартуды ұсыну","«Тек бүгін шешім қабылдасаңыз ғана орын сақталады» деп, шешімге асықтыру"],"a":0},{"t":"Ата-ана: «Баламның мұғалімнің әдістемесі келмейді» деді. Қай әрекет дұрыс?","o":["Мұғалімді бірден ауыстыруды ұсыну, себебі білім сапасы бірінші орында","Мұғалімнің әдістемесі ҰБТ-ға сай болғандықтан, мәселе тек бала жағында екенін дәлелдеу","Алғашқы сабақтарда адаптация қалыпты екенін түсіндіріп, баланың оқу стилін анықтап, мұғалімнен қарқынды түзетуін сұрау, қосымша бақылау жүргізу; мұғалімді ауыстыру — барлығы жасалып, нәтиже болмаған соңғы шара","Мұғалімнің сабақ беруі әлсіз екенін мойындап, сапа бөліміне шағымдануды ұсыну"],"a":2},{"t":"Ата-ана: «Асығыс шешім қабылдап қойдым, енді күмәнданып тұрмын» деді. Қай әрекет дұрыс?","o":["Шешім қабылданған, шарттарды өзгертуге болмайды деп түсіндіру","Түсіністік танытып, нақты қандай мәселе барын анықтап, топты/мұғалімді/кестені қайта реттеу мүмкіндігін айтып, сабаққа қатысып көруді ұсыну; «ұнамаса ақшаңызды қайтарамыз» деп уәде бермеу","«Бір ай қатысып көріңіз, ұнамаса ақшаңызды түгел қайтарамыз» деп уәде беру","Басқа орталықтардың кемшіліктерін айтып, оларға бармауға көндіру"],"a":1},{"t":"Қоңырау кезінде куратор ата-ананың сұрағын әріптесінен нақтылауы керек. Қай әрекет ережеге сәйкес?","o":["Үнсіз отырып, ақпаратты еске түсіруге тырысады, ата-ана күтуі тиіс","Микрофонды өшірмей-ақ, ата-ананың сұрағын әріптесіне дауыстап қайталайды","Нақтылауға қанша уақыт кетсе де, ата-ананы желіде күттіреді","Нақтылау 10–15 секундтан аспаса, микрофонды өшіріп сұрайды (сұрақты трубкаға айқайламайды); ұзаққа созылса, «мен анықтап, сізге кері байланыс беремін» дейді"],"a":3},{"t":"Белсенді тыңдау құралдарына ЖАТПАЙТЫН әрекет қайсысы?","o":["Растау және қайталау","Перефразирование (сөзін өз сөзіңмен қайталап жеткізу)","Ата-ананың сөзін бөліп, бірден бағалап, өз шешімін айту","Эмпатия таныту"],"a":2},{"t":"Ата-ана баласының мұғалімінің жеке нөмірін сұрады, сонымен бірге өз нөмірін орталық басшысына беруге келісті. Куратордың дұрыс әрекеті қайсысы?","o":["Мұғалімнің нөмірін береді, ал ата-ананың нөмірін басшыға рұқсатсыз береді","Мұғалімнің нөмірін тек шұғыл жағдайда береді, ал басшыға ата-ананың нөмірін мүлде бермейді","Нөмірлерді тек ата-ана екінші рет сұраса береді","Мұғалімнің нөмірін бермейді, мәселені өзі жүргізіп КБ береді; ата-ананың рұқсатымен оның нөмірін орталық басшысына бере алады"],"a":3},{"t":"Қай дауыс хабарламасы ережеге сәйкес?","o":["Ата-анадан рұқсат сұрағаннан кейін жіберілген, мазмұны нақты, ұзақтығы 40 секундтық хабарлама","3 секундтық «Сәлеметсіз бе» хабарламасы","Рұқсат сұрамай жіберілген, 2 минуттық егжей-тегжейлі хабарлама","Ата-ана мен мұғалім бір чатта болғанда жіберілген 1 минуттық хабарлама"],"a":0},{"t":"Төмендегі жағдайлардың қайсысында куратор ережені БҰЗБАҒАН?","o":["Куратор жұмыс уақытында жұмыс телефонын дыбыссыз режимге қойып, үстелде қалдырды","Ата-ана кешке, жұмыс уақыты біткен соң жазды; куратор келесі жұмыс күні басталысымен жауап берді","Куратор ата-ана мен мұғалімді бір чатқа қосып, мәселені бірге талқылатты","Куратор КБ беру кезінде баланың үлгерімін сыныптасымен салыстыры  if(un&&!confirm("Жауап берілмеген сұрақтар: "+un+". Соған қарамастан тексеру керек пе?"))return;

 var p=Math.round(sc/20*100);var r=el("div","res","Нәтиже: "+sc+" / 20 ("+p+"%)");r.appendChild(el("small",null,"Жасыл – дұрыс жауап, қызыл – сіздің қате жауабыңыз"));
 var h=document.getElementById("res");h.innerHTML="";h.appendChild(r);window.scrollTo({top:0,behavior:"smooth"})}
